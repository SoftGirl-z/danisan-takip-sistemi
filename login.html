<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#5f8076">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Stulio">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Giriş — Stulio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --sage:        #8fada1;
      --sage-light:  #c4d7d1;
      --sage-dark:   #5f8076;
      --blush:       #e8b4b8;
      --blush-light: #f5dfe1;
      --lavender:    #b8a9d4;
      --lav-dark:    #7d6baa;
      --cream:       #faf7f2;
      --ink:         #2d3340;
      --ink-soft:    #4b5568;
      --stone:       #6b7280;
      --surface:     #ffffff;
      --border:      #e8e2db;
      --r-md:  14px;
      --r-lg:  20px;
      --r-xl:  28px;
      --r-full:9999px;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    /* Background blobs */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 20%, rgba(143,173,161,.2) 0%, transparent 60%),
        radial-gradient(ellipse 60% 60% at 85% 80%, rgba(184,169,212,.18) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 60% 30%, rgba(232,180,184,.12) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    /* Brand header above card */
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-brand-icon {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, var(--sage-light) 0%, var(--blush-light) 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin: 0 auto 14px;
      box-shadow: 0 8px 24px rgba(143,173,161,.25);
    }
    .login-brand h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -.02em;
      background: linear-gradient(135deg, var(--sage-dark) 0%, var(--lav-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-brand p {
      font-size: 12px;
      color: var(--stone);
      text-transform: uppercase;
      letter-spacing: .07em;
      font-weight: 500;
      margin-top: 4px;
    }

    /* Card */
    .login-card {
      background: var(--surface);
      border-radius: var(--r-xl);
      box-shadow: 0 12px 40px rgba(45,51,64,.10), 0 4px 12px rgba(45,51,64,.06);
      border: 1px solid rgba(232,226,219,.8);
      overflow: hidden;
    }

    /* Tabs */
    .tab-row {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 16px;
      border: none;
      background: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--stone);
      cursor: pointer;
      transition: all 200ms ease;
      border-bottom: 2.5px solid transparent;
    }
    .tab-btn.active {
      color: var(--sage-dark);
      border-bottom-color: var(--sage-dark);
      font-weight: 600;
      background: rgba(143,173,161,.04);
    }
    .tab-btn:hover:not(.active) { color: var(--ink); background: rgba(250,247,242,.8); }

    .tab-content { display: none; padding: 28px; }
    .tab-content.active { display: block; }

    /* Form */
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--ink-soft);
      margin-bottom: 7px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      font-size: 14.5px;
      font-family: 'DM Sans', sans-serif;
      color: var(--ink);
      background: #fefefe;
      transition: all 200ms ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(143,173,161,.15);
    }
    .form-group input::placeholder { color: #b0b8c2; }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: var(--r-md);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 220ms ease;
      margin-bottom: 10px;
    }
    .btn:active { transform: scale(.98); }
    .btn:last-child { margin-bottom: 0; }

    .btn-primary {
      background: linear-gradient(135deg, var(--sage) 0%, var(--sage-dark) 100%);
      color: white;
      box-shadow: 0 3px 10px rgba(143,173,161,.4);
    }
    .btn-primary:hover {
      box-shadow: 0 5px 16px rgba(143,173,161,.55);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink-soft);
      border: 1.5px solid var(--border);
    }
    .btn-ghost:hover { background: rgba(250,247,242,.9); border-color: var(--sage-light); }

    /* Footer note */
    .login-footer {
      padding: 16px 28px;
      background: rgba(250,247,242,.7);
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--stone);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .login-footer span { font-size: 14px; }

    @media (max-width: 480px) {
      .tab-content { padding: 20px 18px; }
      .login-footer { padding: 14px 18px; }
    }

    /* Fade in animation */
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(18px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .login-brand  { animation: fadeUp .5s ease both; }
    .login-card   { animation: fadeUp .5s ease .1s both; }
  </style>
</head>
<body>
  <div class="login-wrap">

    <!-- Back to landing -->
    <div style="text-align:center; margin-bottom:16px;">
        <a href="index.html" style="font-size:13px; color:var(--stone); text-decoration:none;
            display:inline-flex; align-items:center; gap:6px;">
            &#8592; Ana Sayfaya Don
        </a>
    </div>

    <!-- Brand -->
    <div class="login-brand">
      <div class="login-brand-icon">🌿</div>
      <h1>Stulio</h1>
      <p>Fizyoterapi · Pilates · Yoga</p>
    </div>

    <!-- Card -->
    <div class="login-card">

      <!-- Tab buttons -->
      <div class="tab-row">
        <button class="tab-btn active" onclick="showTab('login', this)">Giriş Yap</button>
        <button class="tab-btn" onclick="showTab('register', this)">Kayıt Ol</button>
      </div>

      <!-- Login tab -->
      <div id="loginTab" class="tab-content active">
        <div class="form-group">
          <label>E-posta</label>
          <input type="email" id="loginEmail" placeholder="ornek@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Şifre</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" onclick="login()">🔐 Giriş Yap</button>
        <button class="btn btn-ghost" onclick="guestLogin()">👤 Misafir Olarak Devam Et</button>
      </div>

      <!-- Register tab -->
      <div id="registerTab" class="tab-content">

        <!-- Adım 1: İşletme -->
        <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
             color:var(--stone); margin-bottom:14px; display:flex; align-items:center; gap:8px;">
            <span style="width:20px; height:20px; background:var(--sage-light); color:var(--sage-dark);
                border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px;">1</span>
            İşletme Bilgileri
        </div>

        <div class="form-group">
          <label>İşletme Adı *</label>
          <input type="text" id="registerName" placeholder="Örn: Sağlık Fizyoterapi Merkezi">
        </div>
        <div class="form-group">
          <label>Alt Başlık</label>
          <input type="text" id="registerTagline" placeholder="Pilates · Yoga · Fizyoterapi">
        </div>

        <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
             color:var(--stone); margin:18px 0 14px; display:flex; align-items:center; gap:8px;">
            <span style="width:20px; height:20px; background:var(--sage-light); color:var(--sage-dark);
                border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px;">2</span>
            Giriş Bilgileri
        </div>

        <div class="form-group">
          <label>E-posta</label>
          <input type="email" id="registerEmail" placeholder="ornek@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Şifre</label>
          <input type="password" id="registerPassword" placeholder="En az 6 karakter" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Şifre Tekrar</label>
          <input type="password" id="registerPasswordConfirm" placeholder="••••••••" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" onclick="register()">✓ Hesap Oluştur</button>
      </div>

      <!-- Footer note -->
      <div class="login-footer">
        <span>🔒</span> Verileriniz Firebase ile güvenli şekilde saklanır
      </div>

    </div>
  </div>

  <script type="module">
    import * as fb from './firebase-config.js';

    window.login = async function () {
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) { alert('Lütfen e-posta ve şifre girin!'); return; }
      try {
        await fb.loginUser(email, password);
        window.location.href = 'app.html';
      } catch (err) { alert('❌ ' + err.message); }
    };

    window.register = async function () {
      const name    = document.getElementById('registerName').value.trim();
      const tagline = document.getElementById('registerTagline')?.value.trim() || '';
      const email   = document.getElementById('registerEmail').value.trim();
      const pw      = document.getElementById('registerPassword').value;
      const pwc     = document.getElementById('registerPasswordConfirm').value;
      if (!name || !email || !pw) { alert('Tüm alanlar zorunludur'); return; }
      if (pw !== pwc) { alert('Şifreler uyuşmuyor!'); return; }
      try {
        await fb.registerUser(email, pw, name);
        // İşletme profilini localStorage'a kaydet (uygulama açılınca Firestore'a da gider)
        const profile = {
          businessName: name,
          tagline:      tagline || 'Fizyoterapi · Pilates · Yoga',
          logoEmoji:    '🌿',
          theme:        'sage',
          createdAt:    new Date().toISOString(),
        };
        try { localStorage.setItem('studioProfile', JSON.stringify(profile)); } catch(e) {}
        window.location.href = 'app.html';
      } catch (err) { alert('❌ ' + err.message); }
    };

    window.guestLogin = function () { window.location.href = 'app.html'; };

    window.showTab = function (tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tab + 'Tab').classList.add('active');
    };
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./service-worker.js')
          .then(function(reg) { console.log('SW kayıtlı:', reg.scope); })
          .catch(function(err) { console.warn('SW hatası:', err); });
      });
    }
  </script>
</body>
</html>
